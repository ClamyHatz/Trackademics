plugins {
    id 'java'
    id 'application'
    id 'org.openjfx.javafxplugin' version '0.1.0'
}

group = 'trackademics'
version = '1.0-SNAPSHOT'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(25)
    }
}

javafx {
    version = '25'
    modules = ['javafx.controls', 'javafx.fxml']
}

application {
    mainClass = 'Main'
}

repositories {
    mavenCentral()
}

dependencies {
    // Production persistence (SQLite).
    implementation 'org.xerial:sqlite-jdbc:3.53.2.1'

    // Testing: JUnit 5 (same version as the course starter).
    testImplementation platform('org.junit:junit-bom:5.10.0')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'

    // In-memory database for DAO tests.
    testImplementation 'com.h2database:h2:2.4.240'

    // JavaFX UI testing.
    testImplementation 'org.testfx:testfx-core:4.0.18'
    testImplementation 'org.testfx:testfx-junit5:4.0.18'
}

// Pass JavaFX module-path and add-modules to the run task
run {
    doFirst {
        jvmArgs = [
                '--module-path', configurations.runtimeClasspath.asPath,
                '--add-modules', 'javafx.controls,javafx.fxml'
        ]
    }
}

test {
    useJUnitPlatform()
    failOnNoDiscoveredTests = false
}